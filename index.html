<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>N4総復習ハンドブック — Kanae's N4 Review Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --fs-scale: 1;
  --paper: #EEEAE0;
  --paper-2: #E3DDD0;
  --paper-3: #DAD2C1;
  --ink: #24211D;
  --ink-soft: #5B5648;
  --ink-faint: #8B8474;
  --indigo: #29466F;
  --indigo-deep: #1B2F4C;
  --indigo-tint: #DCE3EC;
  --gold: #A67C2E;
  --gold-tint: #F1E4C6;
  --shu: #B5553A;
  --shu-tint: #F4E1D9;
  --matcha: #5D7A55;
  --matcha-tint: #E3EBE0;
  --line: #D6CDBB;
  --line-soft: #E1DACB;
  --shadow: rgba(40,32,16,.12);
}
body.dark{
  --paper: #1E1B17;
  --paper-2: #262220;
  --paper-3: #322D28;
  --ink: #EDE6D8;
  --ink-soft: #C1B8A6;
  --ink-faint: #857D6C;
  --indigo: #8FADD1;
  --indigo-deep: #6C90BA;
  --indigo-tint: #29354A;
  --gold: #D8B25E;
  --gold-tint: #3B3120;
  --shu: #DD8265;
  --shu-tint: #402A22;
  --matcha: #9DBC97;
  --matcha-tint: #263323;
  --line: #453F37;
  --line-soft: #362F29;
  --shadow: rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth; font-size:calc(16px * var(--fs-scale));}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.7;
  transition:background .25s ease, color .25s ease;
}

/* ============================================================
   FURIGANA (ruby) — toggled globally
   ============================================================ */
ruby{ ruby-position: over; }
rt{
  font-family:var(--sans);
  font-size:.55em;
  color:var(--indigo);
  font-weight:500;
  user-select:none;
}
body.no-furigana rt{ display:none; }
body.dark ruby rt{ color:var(--indigo); }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.shell{ display:flex; min-height:100vh; }

.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:272px;
  background:var(--paper-2);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  z-index:40;
  transition:transform .25s ease, background .25s ease, border-color .25s ease;
}
.sidebar-scroll{ flex:1; overflow-y:auto; padding:0 0 12px 0; }
.sidebar-scroll::-webkit-scrollbar{ width:6px; }
.sidebar-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

.brand{
  padding:24px 22px 16px;
  border-bottom:1px solid var(--line);
}
.brand .jp{
  font-family:var(--serif); font-weight:700; font-size:1.5rem;
  color:var(--ink); letter-spacing:.02em; line-height:1.3;
}
.brand .en{
  font-size:.72rem; color:var(--ink-faint); margin-top:4px;
  letter-spacing:.03em;
}

nav.mainnav{ padding:14px 12px; }
nav.mainnav .navgroup-label{
  font-size:.68rem; color:var(--ink-faint); padding:10px 10px 4px;
  letter-spacing:.08em;
}
nav.mainnav button.navlink{
  display:flex; align-items:center; gap:10px; width:100%;
  text-align:left; background:none; border:none; cursor:pointer;
  color:var(--ink-soft); font-family:var(--sans); font-size:.92rem;
  padding:10px 10px; border-radius:var(--radius); margin-bottom:2px;
  transition:background .15s ease, color .15s ease;
}
nav.mainnav button.navlink .mk{
  font-family:var(--serif); font-size:1.05rem; width:1.4em; text-align:center;
  color:var(--indigo);
}
nav.mainnav button.navlink:hover{ background:var(--paper-3); color:var(--ink); }
nav.mainnav button.navlink.active{ background:var(--indigo); color:#fff; }
nav.mainnav button.navlink.active .mk{ color:#fff; }

.settings-panel{
  border-top:1px solid var(--line); padding:16px 18px 20px;
  background:var(--paper-2);
}
.settings-panel .stitle{
  font-size:.68rem; color:var(--ink-faint); letter-spacing:.08em; margin-bottom:10px;
}
.setting-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px; font-size:.82rem; color:var(--ink-soft);
}
.switch{
  position:relative; width:38px; height:21px; flex-shrink:0;
  background:var(--line); border-radius:20px; cursor:pointer; border:none;
  transition:background .2s ease;
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:17px; height:17px;
  background:#fff; border-radius:50%; transition:left .2s ease;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.switch.on{ background:var(--indigo); }
.switch.on::after{ left:19px; }
.fontsize-controls{ display:flex; gap:6px; }
.fontsize-controls button{
  flex:1; padding:5px 0; font-family:var(--sans); font-size:.78rem;
  background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
  border-radius:var(--radius); cursor:pointer;
}
.fontsize-controls button.active{ background:var(--indigo); color:#fff; border-color:var(--indigo); }

.progress-mini{ font-size:.72rem; color:var(--ink-faint); margin-top:12px; }
.progress-bar-track{ height:5px; background:var(--paper-3); border-radius:4px; margin-top:5px; overflow:hidden; }
.progress-bar-fill{ height:100%; background:var(--gold); width:0%; transition:width .3s ease; }

.menubtn{
  display:none; position:fixed; top:14px; left:14px; z-index:60;
  background:var(--indigo); color:#fff; border:none; border-radius:var(--radius);
  width:40px; height:40px; font-size:1.1rem; cursor:pointer;
  box-shadow:0 2px 8px var(--shadow);
}
.scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35; }

main.content{
  margin-left:272px; flex:1; min-width:0;
  padding:44px 48px 100px;
}
.section{ display:none; max-width:900px; }
.section.active{ display:block; animation:fadein .3s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.section-head{ margin-bottom:34px; }
.section-head .eyebrow-jp{
  font-family:var(--serif); font-size:1rem; color:var(--gold); margin-bottom:2px;
}
.section-head h1{
  font-family:var(--serif); font-weight:700; font-size:2.15rem; margin:0 0 10px;
  color:var(--ink); line-height:1.25;
}
.section-head p{ color:var(--ink-soft); max-width:var(--measure); margin:0; font-size:.98rem; }

h2.modtitle{
  font-family:var(--serif); font-size:1.4rem; margin:48px 0 6px; color:var(--ink);
  display:flex; align-items:baseline; gap:10px;
}
h2.modtitle .modnum{ color:var(--gold); font-size:1.1rem; }
.modtitle-en{ font-size:.8rem; color:var(--ink-faint); font-weight:400; margin-bottom:22px; }

/* module jump pills */
.modjump{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:36px; }
.modjump button{
  font-family:var(--sans); font-size:.78rem; padding:7px 13px;
  background:var(--paper-2); border:1px solid var(--line); color:var(--ink-soft);
  border-radius:20px; cursor:pointer; transition:all .15s ease;
}
.modjump button:hover{ border-color:var(--indigo); color:var(--indigo); }

/* ============================================================
   GRAMMAR CARD
   ============================================================ */
.gcard{
  background:var(--paper-2);
  border-left:4px solid var(--accent, var(--indigo));
  border-radius:0 var(--radius) var(--radius) 0;
  padding:22px 26px 26px;
  margin-bottom:22px;
  box-shadow:0 1px 3px var(--shadow);
}
.gcard-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:10px;}
.gcard-title .jp{ font-family:var(--serif); font-size:1.5rem; color:var(--ink); }
.gcard-title .romaji{ font-size:.76rem; color:var(--ink-faint); margin-top:1px; }
.gcard-title .fn{ font-size:.86rem; color:var(--accent, var(--indigo)); font-weight:700; margin-top:4px; }
.sourcetags{ display:flex; gap:6px; flex-wrap:wrap; }
.sourcetag{
  font-size:.68rem; padding:3px 8px; border:1px solid var(--line);
  border-radius:20px; color:var(--ink-faint); white-space:nowrap;
}
.gcard .explain{ font-size:.93rem; color:var(--ink-soft); margin:10px 0 14px; max-width:var(--measure); }
.gcard .explain b{ color:var(--ink); }

.formation-box{
  background:var(--paper); border:1px dashed var(--line); border-radius:var(--radius);
  padding:12px 16px; margin-bottom:16px; font-size:.86rem;
}
.formation-box .flabel{ font-size:.68rem; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:6px; }
.formation-box .fline{ font-family:var(--serif); font-size:1.02rem; color:var(--ink); margin:3px 0; }
.formation-box .fline .arrow{ color:var(--accent, var(--indigo)); margin:0 6px; }

.examples{ margin-bottom:16px; }
.ex-item{ padding:9px 0; border-bottom:1px solid var(--line-soft); }
.ex-item:last-child{ border-bottom:none; }
.ex-jp{ font-family:var(--serif); font-size:1.2rem; color:var(--ink); line-height:2.1; }
.ex-en{ font-size:.82rem; color:var(--ink-faint); margin-top:2px; }

.dialogue-box{
  background:var(--paper); border-radius:var(--radius); padding:16px 18px;
  margin-bottom:16px; border:1px solid var(--line-soft);
}
.dialogue-box .dlabel{ font-size:.68rem; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:10px; }
.dline{ display:flex; gap:10px; margin-bottom:9px; align-items:flex-start; }
.dline:last-child{ margin-bottom:0; }
.dline .speaker{
  flex-shrink:0; width:64px; font-size:.72rem; color:#fff; background:var(--accent, var(--indigo));
  border-radius:3px; text-align:center; padding:3px 4px; height:fit-content; margin-top:3px;
}
.dline .dtext .jp{ font-family:var(--serif); font-size:1.08rem; line-height:1.9; }
.dline .dtext .en{ font-size:.78rem; color:var(--ink-faint); margin-top:1px; }
.kaiwa-tip{
  font-size:.82rem; color:var(--matcha); margin-top:10px; padding-top:10px;
  border-top:1px dashed var(--line);
}
.kaiwa-tip b{ color:var(--matcha); }

/* ============================================================
   QUIZ WIDGET
   ============================================================ */
.quizbox{ margin-top:6px; }
.quizbox .qlabel{ font-size:.68rem; color:var(--ink-faint); letter-spacing:.06em; margin-bottom:8px; }
.qitem{ margin-bottom:14px; }
.qitem:last-child{ margin-bottom:0; }
.qprompt{ font-size:.92rem; color:var(--ink); margin-bottom:8px; font-family:var(--serif); }
.qchoices{ display:flex; flex-direction:column; gap:6px; }
.qchoice{
  text-align:left; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); padding:8px 12px; font-family:var(--sans);
  font-size:.86rem; color:var(--ink-soft); cursor:pointer; transition:all .15s ease;
}
.qchoice:hover{ border-color:var(--accent, var(--indigo)); }
.qchoice.correct{ background:var(--matcha-tint); border-color:var(--matcha); color:var(--ink); font-weight:700; }
.qchoice.incorrect{ background:var(--shu-tint); border-color:var(--shu); color:var(--ink); }
.qchoice.disabled{ pointer-events:none; opacity:.55; }
.qexplain{
  font-size:.8rem; color:var(--ink-soft); margin-top:7px; padding:8px 12px;
  background:var(--paper); border-left:3px solid var(--accent, var(--indigo)); display:none;
}
.qexplain.show{ display:block; }

/* ============================================================
   KANJI TABLE
   ============================================================ */
.kanji-toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
.kanji-search{
  flex:1; min-width:200px; padding:9px 14px; border:1px solid var(--line);
  border-radius:20px; background:var(--paper-2); color:var(--ink); font-family:var(--sans);
  font-size:.88rem;
}
.kanji-search:focus{ outline:none; border-color:var(--indigo); }
.kanji-count{ font-size:.78rem; color:var(--ink-faint); white-space:nowrap; }

.kgrid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;
  margin-bottom:14px;
}
.kcard{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; display:flex; gap:14px; align-items:flex-start;
}
.kcard .kj{ font-family:var(--serif); font-size:2.1rem; color:var(--ink); line-height:1; flex-shrink:0; }
.kcard .kmeta{ font-size:.78rem; }
.kcard .kmeaning{ color:var(--ink); font-weight:700; margin-bottom:3px; }
.kcard .kreading{ color:var(--ink-soft); }
.kcard .kreading .lbl{ color:var(--ink-faint); }
.kcard .kword{ color:var(--gold); margin-top:4px; }

.collapsible-head{
  cursor:pointer; display:flex; align-items:center; gap:8px; margin:36px 0 12px;
  color:var(--ink-soft); font-size:.88rem; user-select:none;
}
.collapsible-head .tri{ transition:transform .2s ease; color:var(--gold); }
.collapsible-head.open .tri{ transform:rotate(90deg); }
.collapsible-body{ display:none; }
.collapsible-body.open{ display:block; }

/* ============================================================
   READING PASSAGES
   ============================================================ */
.passage-card{
  background:var(--paper-2); border-radius:var(--radius); padding:24px 28px;
  margin-bottom:16px; border:1px solid var(--line);
}
.passage-card .ptitle{ font-family:var(--serif); font-size:1.15rem; color:var(--gold); margin-bottom:4px; }
.passage-card .ptitle-en{ font-size:.76rem; color:var(--ink-faint); margin-bottom:16px; }
.passage-text{
  font-family:var(--serif); font-size:1.18rem; line-height:2.3; color:var(--ink);
  max-width:var(--measure); margin-bottom:6px; white-space:pre-line;
}
.passage-gloss-toggle{
  font-size:.76rem; color:var(--indigo); cursor:pointer; margin-bottom:14px; display:inline-block;
  border-bottom:1px dotted var(--indigo);
}
.passage-gloss{
  display:none; font-size:.82rem; color:var(--ink-soft); background:var(--paper);
  padding:12px 16px; border-radius:var(--radius); margin-bottom:16px; white-space:pre-line;
}
.passage-gloss.show{ display:block; }

/* ============================================================
   KAIWA LAB
   ============================================================ */
.tipgrid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px;
  margin-bottom:36px;
}
.tipcard{
  background:var(--paper-2); border-radius:var(--radius); padding:16px 18px;
  border-top:3px solid var(--gold);
}
.tipcard .ttitle{ font-weight:700; font-size:.9rem; margin-bottom:6px; color:var(--ink); }
.tipcard p{ font-size:.82rem; color:var(--ink-soft); margin:0; }

.phrasebank{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px;
  margin-bottom:36px;
}
.phrase{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 14px;
}
.phrase .pjp{ font-family:var(--serif); font-size:1.05rem; color:var(--ink); }
.phrase .pen{ font-size:.76rem; color:var(--ink-faint); margin-top:2px; }

/* phrase bank — category jump bar + grouped headings */
.pb-nav{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:26px; }
.pb-nav button{
  font-family:var(--serif); font-size:.88rem; padding:5px 12px;
  background:var(--paper-2); border:1px solid var(--line); color:var(--ink-soft);
  border-radius:20px; cursor:pointer; transition:all .15s ease;
}
.pb-nav button:hover{ border-color:var(--matcha); color:var(--matcha); }
.pb-group{ scroll-margin-top:20px; }
.pb-cat{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  margin:0 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line-soft);
}
.pb-cat .jp{ font-family:var(--serif); font-size:1.12rem; color:var(--matcha); }
.pb-cat .en{ font-size:.76rem; color:var(--ink-faint); }
.phrasebank{ margin-bottom:30px; }

/* scenario — the lines worth memorising, pulled out of the dialogue */
.keyphrases{
  margin-top:14px; padding:13px 16px; border-radius:var(--radius);
  background:var(--gold-tint); border:1px solid var(--line-soft);
}
.keyphrases .kplabel{
  font-size:.66rem; letter-spacing:.08em; color:var(--gold); margin-bottom:8px; font-weight:700;
}
.kpline{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  padding:4px 0; border-bottom:1px dotted var(--line);
}
.kpline:last-child{ border-bottom:none; }
.kpline .kpjp{ font-family:var(--serif); font-size:1.04rem; color:var(--ink); }
.kpline .kpen{ font-size:.76rem; color:var(--ink-soft); }

.scenario-card{
  background:var(--paper-2); border-radius:var(--radius); margin-bottom:22px; overflow:hidden;
  border:1px solid var(--line); scroll-margin-top:20px;
}
.scenario-head{
  background:var(--indigo); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;
}
.scenario-head .sjp{ font-family:var(--serif); font-size:1.15rem; }
.scenario-head .sen{ font-size:.76rem; opacity:.85; }
.scenario-body{ padding:20px 22px; }
.scenario-setup{ font-size:.83rem; color:var(--ink-soft); margin-bottom:14px; font-style:italic; }
.roleplay-note{
  margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  font-size:.82rem; color:var(--ink-soft);
}
.roleplay-note b{ color:var(--indigo); }

/* ============================================================
   QUIZ CENTER (final)
   ============================================================ */
.qc-score{
  background:var(--paper-2); border-radius:var(--radius); padding:20px 26px;
  margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
}
.qc-score .num{ font-family:var(--serif); font-size:2.2rem; color:var(--gold); }
.qc-score .lbl{ font-size:.78rem; color:var(--ink-faint); }
.qc-reset{
  background:none; border:1px solid var(--line); color:var(--ink-soft);
  padding:8px 16px; border-radius:20px; cursor:pointer; font-family:var(--sans); font-size:.82rem;
}
.qc-reset:hover{ border-color:var(--shu); color:var(--shu); }
.qc-group-title{ font-family:var(--serif); font-size:1.1rem; color:var(--gold); margin:28px 0 12px; }

footer.pagefoot{
  margin-top:60px; padding-top:20px; border-top:1px solid var(--line);
  font-size:.74rem; color:var(--ink-faint); max-width:var(--measure);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 860px){
  .sidebar{ transform:translateX(-100%); }
  .sidebar.open{ transform:translateX(0); }
  .menubtn{ display:block; }
  .scrim.show{ display:block; }
  main.content{ margin-left:0; padding:70px 20px 80px; }
  .section-head h1{ font-size:1.6rem; }
}
</style>
</head>
<body>

<button class="menubtn" id="menubtn" aria-label="Menu">&#9776;</button>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="jp">N4総復習</div>
      <div class="en">Your N4 Review Handbook</div>
    </div>
    <div class="sidebar-scroll">
      <nav class="mainnav" id="mainnav">
        <div class="navgroup-label">MENU</div>
        <button class="navlink" data-section="overview"><span class="mk">概</span> Overview</button>
        <button class="navlink" data-section="grammar"><span class="mk">文</span> Grammar Deep-Dive</button>
        <button class="navlink" data-section="kanji"><span class="mk">漢</span> Kanji Focus</button>
        <button class="navlink" data-section="reading"><span class="mk">読</span> Reading Lab</button>
        <button class="navlink" data-section="kaiwa"><span class="mk">話</span> Kaiwa Lab</button>
        <button class="navlink" data-section="quiz"><span class="mk">力</span> Quiz Center</button>
      </nav>
    </div>
    <div class="settings-panel">
      <div class="stitle">SETTINGS ・ 設定</div>
      <div class="setting-row">
        <span>Furigana ふりがな</span>
        <button class="switch on" id="toggle-furigana"></button>
      </div>
      <div class="setting-row">
        <span>Dark mode</span>
        <button class="switch" id="toggle-dark"></button>
      </div>
      <div class="setting-row" style="display:block;">
        <span style="display:block;margin-bottom:6px;">Text size</span>
        <div class="fontsize-controls">
          <button data-size="0.9">A-</button>
          <button data-size="1" class="active">A</button>
          <button data-size="1.18">A+</button>
        </div>
      </div>
      <div class="progress-mini">
        Quiz progress: <span id="progress-text">0 / 0</span>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="content">

    <!-- OVERVIEW -->
    <section class="section active" id="sec-overview"></section>

    <!-- GRAMMAR -->

    <section class="section" id="sec-reading"></section>

<!-- ============ CONTENT DATA ============
     Every grammar point, kanji, passage, scenario and quiz item
     lives in these files. Edit them to add content; the render
     code below never needs to change. Load order matters:
     00-core.js defines the N4 namespace and the R() furigana
     helper that the other files use.                          -->
<script src="data/00-core.js"></script>
<script src="data/grammar.js"></script>
<script src="data/kanji.js"></script>
<script src="data/reading.js"></script>
<script src="data/kaiwa.js"></script>
<script src="data/quiz.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   DATA BINDING
   All content lives in the data/*.js files loaded just above;
   each hangs its arrays off the global N4 object. To add or
   change content, edit those files — not this one.
   ============================================================ */
var grammarModules  = N4.grammarModules;
var kanjiFocus      = N4.kanjiFocus;
var kanjiQuiz       = N4.kanjiQuiz;
var readingPassages = N4.readingPassages;
var kaiwaTips       = N4.kaiwaTips;
var phraseBank      = N4.phraseBank;
var kaiwaScenarios  = N4.kaiwaScenarios;
var finalQuizGroups = N4.finalQuizGroups;

/* Fold every supplemental example round into its grammar point.
   Round arrays are parallel to the flat list of points, so a new
   round needs no change here — just add it in data/grammar.js. */
(function mergeExampleRounds(){
  var i = 0;
  grammarModules.forEach(function(mod){
    mod.points.forEach(function(point){
      N4.grammarExampleRounds.forEach(function(round){
        var ex = round[i];
        if(ex){ point.examples.push({jp:ex[0], en:ex[1]}); }
      });
      i++;
    });
  });
})();


/* ============================================================
   QUIZ ENGINE (shared by every quiz on the page)
   ============================================================ */
var quizAnswered = {};   // qid -> true once attempted
var quizCorrect  = {};   // qid -> true if correct on first try
var quizTotal = 0;

function quizHTML(qid, item, accentVar){
  var choicesHtml = item.choices.map(function(c, idx){
    return '<button class="qchoice" data-qid="'+qid+'" data-idx="'+idx+'">'+c+'</button>';
  }).join('');
  return '<div class="qitem" data-qcontainer="'+qid+'">'+
           '<div class="qprompt">'+item.q+'</div>'+
           '<div class="qchoices">'+choicesHtml+'</div>'+
           '<div class="qexplain" id="explain-'+qid+'">'+item.ex+'</div>'+
         '</div>';
}

function renderQuizBlock(idPrefix, items, accentVar){
  var html = '<div class="quizbox"><div class="qlabel">CHECK YOUR UNDERSTANDING</div>';
  items.forEach(function(item, i){
    var qid = idPrefix+'-q'+i;
    quizTotal++;
    QUIZ_BANK[qid] = item;
    html += quizHTML(qid, item, accentVar);
  });
  html += '</div>';
  return html;
}

var QUIZ_BANK = {};
var finalQuizQids = [];

function shuffled(items){
  var copy = items.slice();
  for(var i=copy.length-1; i>0; i--){
    var j = Math.floor(Math.random() * (i+1));
    var temp = copy[i]; copy[i] = copy[j]; copy[j] = temp;
  }
  return copy;
}

function getFinalQuizSample(){
  var pool = [];
  finalQuizGroups.forEach(function(group){
    group.items.forEach(function(item){ pool.push({group:group.title, item:item}); });
  });
  return shuffled(pool).slice(0, Math.min(10, pool.length));
}

function clearFinalQuizItems(){
  finalQuizQids.forEach(function(qid){
    delete QUIZ_BANK[qid];
    delete quizAnswered[qid];
    delete quizCorrect[qid];
  });
  quizTotal -= finalQuizQids.length;
  finalQuizQids = [];
}

document.addEventListener('click', function(e){
  var btn = e.target.closest('.qchoice');
  if(!btn) return;
  var qid = btn.getAttribute('data-qid');
  var idx = parseInt(btn.getAttribute('data-idx'),10);
  var item = QUIZ_BANK[qid];
  if(!item) return;
  var container = btn.closest('[data-qcontainer]');
  var allBtns = container.querySelectorAll('.qchoice');
  var alreadyAnswered = quizAnswered[qid];

  allBtns.forEach(function(b){ b.classList.add('disabled'); });

  if(idx === item.a){
    btn.classList.add('correct');
    if(!alreadyAnswered){ quizCorrect[qid] = true; }
  } else {
    btn.classList.add('incorrect');
    allBtns[item.a] && allBtns[item.a].classList.add('correct');
    quizCorrect[qid] = false;
  }
  quizAnswered[qid] = true;
  var explainBox = document.getElementById('explain-'+qid);
  if(explainBox) explainBox.classList.add('show');

  // allow retry: re-enable after a short delay so learner can re-attempt
  setTimeout(function(){
    allBtns.forEach(function(b){ b.classList.remove('disabled'); });
  }, 250);

  updateProgress();
  updateQuizCenterScore();
});

function updateProgress(){
  var answered = Object.keys(quizAnswered).length;
  var pct = quizTotal ? Math.round((answered/quizTotal)*100) : 0;
  var textEl = document.getElementById('progress-text');
  var fillEl = document.getElementById('progress-fill');
  if(textEl) textEl.textContent = answered + ' / ' + quizTotal;
  if(fillEl) fillEl.style.width = pct + '%';
}

function updateQuizCenterScore(){
  var numEl = document.getElementById('qc-score-num');
  if(!numEl) return;
  var correct = Object.keys(quizCorrect).filter(function(k){return quizCorrect[k];}).length;
  var answered = Object.keys(quizAnswered).length;
  numEl.textContent = correct + ' / ' + answered;
}

/* ============================================================
   RENDER: OVERVIEW
   ============================================================ */
function renderOverview(){
  var html = '';
  html += '<div class="section-head">'+
            '<div class="eyebrow-jp">はじめに</div>'+
            '<h1>Your N4 Review Handbook</h1>'+
            '<p>You have already been through the whole N4 syllabus — Minna no Nihongo up to Lesson 47, grammar, kanji, all of it. A 65% mock score at this stage almost never means "I don\u2019t know N4." It usually means a handful of specific points are shaky (the four conditionals, passive vs. causative, the そう family) and that speaking hasn\u2019t caught up with reading. This handbook is built to fix both: a precision grammar review with sources cross-referenced to Minna no Nihongo, Genki, and Sou Matome, the complete N4 kanji list with readings and compounds, reading practice in exam style, and a dedicated Kaiwa Lab for the conversation side.</p>'+
          '</div>';

  html += '<div class="tipgrid">'+
    overviewCard('文法', 'Grammar Deep-Dive', countGrammarPoints()+' grammar points across '+grammarModules.length+' modules — the four conditionals, passive/causative, giving &amp; receiving, hearsay &amp; appearance, and more. Each has a formation box, around '+(3 + N4.grammarExampleRounds.length)+' example sentences, a mini dialogue, and a quiz.') +
    overviewCard('漢字', 'Kanji Focus', 'The full N4 kanji set, all '+kanjiFocus.length+' characters — nothing filtered out — each with both readings, the core meaning, and a common compound, plus a '+kanjiQuiz.length+'-question reading check.') +
    overviewCard('読解', 'Reading Lab', readingPassages.length+' short passages in JLPT reading style — diary entries, notices, and emails — each with comprehension questions and a vocabulary gloss you can hide.') +
    overviewCard('会話', 'Kaiwa Lab', kaiwaScenarios.length+' real trip and daily-life scenarios with key phrases pulled out of each one, a '+countPhrases()+'-phrase bank grouped by situation, and role-play notes for both sides of the conversation.') +
    overviewCard('力', 'Quiz Center', 'A mixed mock-test style review pulling grammar, kanji, reading and conversation together — '+countQuizPool()+' questions in the pool, 10 drawn at random each visit — plus your running score across the whole handbook.') +
    overviewCard('設定', 'Settings', 'Furigana on/off, dark mode, and text size — in the sidebar, always available.') +
  '</div>';

  html += '<div class="collapsible-head" id="how-to-use-head"><span class="tri">\u25B8</span> How to actually use this before your mocks</div>';
  html += '<div class="collapsible-body" id="how-to-use-body"><div class="gcard" style="border-left-color:var(--gold);">'+
    '<div class="explain" style="margin-bottom:0;">'+
    '<b>1. Diagnose first.</b> Skim the Grammar Deep-Dive module titles below. The ones where you hesitate even reading the title (not the explanation) are your real gaps — start there, not from the top.<br><br>'+
    '<b>2. Read the nuance, not just the formation.</b> Most N4 mock-test mistakes come from mixing up two similar patterns (たら vs ば, そう vs よう, てもいい vs なくてもいい) rather than not knowing either one exists. The explanation text calls these confusions out directly.<br><br>'+
    '<b>3. Say the dialogues out loud.</b> Reading a dialogue silently trains recognition; reading it out loud, then covering the Japanese and reconstructing it from the English, trains production \u2014 which is the actual kaiwa muscle.<br><br>'+
    '<b>4. Do the quizzes cold, then again after review.</b> If you get a quiz question right the first time, that point is probably fine for the mock exam. If you get it wrong, that is exam-week priority material.'+
    '</div></div></div>';

  document.getElementById('sec-overview').innerHTML = html;
  bindCollapsible('how-to-use-head','how-to-use-body');
}
function overviewCard(mk, title, body){
  return '<div class="tipcard"><div class="ttitle">'+mk+' \u2014 '+title+'</div><p>'+body+'</p></div>';
}

/* Small counters so the copy on the page never drifts from the data. */
function countGrammarPoints(){
  return grammarModules.reduce(function(n, m){ return n + m.points.length; }, 0);
}
function countQuizPool(){
  return finalQuizGroups.reduce(function(n, g){ return n + g.items.length; }, 0);
}

/* ============================================================
   RENDER: GRAMMAR
   ============================================================ */
function renderGrammar(){
  var html = '<div class="section-head">'+
    '<div class="eyebrow-jp">文法総復習</div>'+
    '<h1>Grammar Deep-Dive</h1>'+
    '<p>30 points, 7 modules, organized by function rather than by textbook chapter \u2014 because that\u2019s how the JLPT actually tests you: it mixes lessons together and checks whether you can tell similar patterns apart. Source tags point back to roughly where each point lives in Minna no Nihongo (MNN), Genki, and Sou Matome N4, so you can pull up more drills in the book you\u2019re already using. Lesson numbers are approximate cross-references, not exact page citations \u2014 editions vary slightly.</p>'+
  '</div>';

  html += '<div class="modjump">';
  grammarModules.forEach(function(mod, i){
    html += '<button onclick="document.getElementById(\'mod-'+i+'\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">'+mod.num+'. '+mod.jpTitle+'</button>';
  });
  html += '</div>';

  grammarModules.forEach(function(mod, mi){
    html += '<h2 class="modtitle" id="mod-'+mi+'"><span class="modnum">'+mod.num+'</span> '+mod.jpTitle+'</h2>';
    html += '<div class="modtitle-en">'+mod.enTitle+'</div>';
    mod.points.forEach(function(pt, pi){
      html += renderGrammarCard(mod, mi, pt, pi);
    });
  });

  document.getElementById('sec-grammar').innerHTML = html;
}

function renderGrammarCard(mod, mi, pt, pi){
  var accent = 'var(--'+mod.accent+')';
  var pid = 'g'+mi+'-'+pi;
  var html = '<div class="gcard" style="--accent:'+accent+';">';
  html += '<div class="gcard-head">'+
            '<div class="gcard-title">'+
              '<div class="jp">'+pt.jp+'</div>'+
              '<div class="romaji">'+pt.romaji+'</div>'+
              '<div class="fn" style="color:'+accent+';">'+pt.fn+'</div>'+
            '</div>'+
            '<div class="sourcetags">'+ pt.sources.map(function(s){return '<span class="sourcetag">'+s+'</span>';}).join('') +'</div>'+
          '</div>';
  html += '<div class="explain">'+pt.explain+'</div>';

  if(pt.formation && pt.formation.length){
    html += '<div class="formation-box"><div class="flabel">FORMATION</div>';
    pt.formation.forEach(function(f){ html += '<div class="fline">'+f+'</div>'; });
    html += '</div>';
  }

  if(pt.examples && pt.examples.length){
    html += '<div class="examples">';
    pt.examples.forEach(function(ex){
      html += '<div class="ex-item"><div class="ex-jp">'+ex.jp+'</div><div class="ex-en">'+ex.en+'</div></div>';
    });
    html += '</div>';
  }

  if(pt.dialogue && pt.dialogue.length){
    html += '<div class="dialogue-box"><div class="dlabel">KAIWA SAMPLE</div>';
    pt.dialogue.forEach(function(d){
      html += '<div class="dline"><div class="speaker" style="background:'+accent+';">'+d.who+'</div>'+
              '<div class="dtext"><div class="jp">'+d.jp+'</div><div class="en">'+d.en+'</div></div></div>';
    });
    if(pt.tip){ html += '<div class="kaiwa-tip"><b>Tip \u2014</b> '+pt.tip+'</div>'; }
    html += '</div>';
  }

  if(pt.quiz && pt.quiz.length){
    html += renderQuizBlock(pid, pt.quiz, accent);
  }

  html += '</div>';
  return html;
}

/* ============================================================
   RENDER: KANJI
   ============================================================ */
function renderKanji(){
  var html = '<div class="section-head">'+
    '<div class="eyebrow-jp">漢字フォーカス</div>'+
    '<h1>Kanji Focus</h1>'+
    '<p>The full N4-level kanji set \u2014 all '+kanjiFocus.length+' characters, nothing held back \u2014 with both readings, the core meaning, and one common compound for each. It won\u2019t match "official" N4 lists exactly (there is no official list \u2014 JLPT never publishes one), but it is grounded in the standard N4 study references. Use the search box below to jump straight to a character, reading, or meaning.</p>'+
  '</div>';

  html += '<div class="kanji-toolbar">'+
    '<input class="kanji-search" id="kanji-search" placeholder="Search by kanji, reading, or meaning\u2026" />'+
    '<span class="kanji-count" id="kanji-count"></span>'+
  '</div>';

  html += '<div class="kgrid" id="kanji-grid"></div>';

  html += '<h2 class="modtitle" style="margin-top:44px;"><span class="modnum">\u5546</span> Kanji Check</h2>'+
          '<div class="modtitle-en">Reading and meaning quiz built from your focus list</div>';
  html += '<div class="gcard" style="--accent:var(--gold);">' + renderQuizBlock('kanji', kanjiQuiz, 'var(--gold)') + '</div>';

  document.getElementById('sec-kanji').innerHTML = html;

  renderKanjiGrid('');
  document.getElementById('kanji-search').addEventListener('input', function(e){
    renderKanjiGrid(e.target.value.trim());
  });
}

function renderKanjiGrid(filter){
  var f = filter.toLowerCase();
  var filtered = kanjiFocus.filter(function(k){
    if(!f) return true;
    return k.kj.indexOf(f) > -1 || k.on.toLowerCase().indexOf(f) > -1 ||
           k.kun.toLowerCase().indexOf(f) > -1 || k.meaning.toLowerCase().indexOf(f) > -1;
  });
  var html = filtered.map(function(k){
    return '<div class="kcard"><div class="kj">'+k.kj+'</div>'+
      '<div class="kmeta"><div class="kmeaning">'+k.meaning+'</div>'+
      '<div class="kreading"><span class="lbl">on\u2014</span> '+k.on+' &nbsp; <span class="lbl">kun\u2014</span> '+k.kun+'</div>'+
      '<div class="kword">'+k.word+'</div></div></div>';
  }).join('');
  document.getElementById('kanji-grid').innerHTML = html;
  document.getElementById('kanji-count').textContent = filtered.length + ' / ' + kanjiFocus.length + ' shown';
}

/* ============================================================
   RENDER: READING
   ============================================================ */
function renderReading(){
  var html = '<div class="section-head">'+
    '<div class="eyebrow-jp">読解ラボ</div>'+
    '<h1>Reading Lab</h1>'+
    '<p>'+readingPassages.length+' short passages written in the style of N4 短文 (short-passage) reading questions\u2014 diary entries, shop and building notices, and emails between friends. Try reading each one without the gloss first, answer the questions, then open the gloss to check anything you guessed at. The notices repay extra attention: fixed service phrases like ご利用ください and 本日のみ turn up constantly in real life as well as in the exam.</p>'+
  '</div>';

  readingPassages.forEach(function(p, i){
    html += '<div class="passage-card">'+
      '<div class="ptitle">'+p.title+'</div>'+
      '<div class="ptitle-en">'+p.titleEn+'</div>'+
      '<div class="passage-text">'+p.text+'</div>'+
      '<span class="passage-gloss-toggle" onclick="this.nextElementSibling.classList.toggle(\'show\')">show vocabulary gloss</span>'+
      '<div class="passage-gloss">'+p.gloss+'</div>'+
      renderQuizBlock('read'+i, p.quiz, 'var(--indigo)') +
    '</div>';
  });

  document.getElementById('sec-reading').innerHTML = html;
}

/* ============================================================
   RENDER: KAIWA LAB
   ============================================================ */
function countPhrases(){
  return phraseBank.reduce(function(n, g){ return n + g.items.length; }, 0);
}

function renderKaiwa(){
  var html = '<div class="section-head">'+
    '<div class="eyebrow-jp">会話ラボ</div>'+
    '<h1>Kaiwa Lab</h1>'+
    '<p>Grammar accuracy and conversation fluency are genuinely different skills \u2014 it is completely normal to be strong in one and shaky in the other. This section is built around what you\u2019ll actually need in Japan in December: '+kaiwaScenarios.length+' real scenarios covering arrival, getting around, shops, food, health, work and small talk; '+countPhrases()+' phrases grouped by the job they do, so you can find one under pressure; and role-play notes for both sides of every conversation.</p>'+
  '</div>';

  html += '<div class="tipgrid">';
  kaiwaTips.forEach(function(t){
    html += '<div class="tipcard"><div class="ttitle">'+t.title+'</div><p>'+t.body+'</p></div>';
  });
  html += '</div>';

  html += '<h2 class="modtitle"><span class="modnum">\u30D5</span> Phrase Bank</h2>'+
          '<div class="modtitle-en">'+countPhrases()+' phrases in '+phraseBank.length+' groups \u2014 grouped by what the phrase does, because that is how you retrieve it mid-conversation</div>';

  html += '<div class="pb-nav">';
  phraseBank.forEach(function(g, gi){
    html += '<button onclick="document.getElementById(\'pb-'+gi+'\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">'+g.cat+'</button>';
  });
  html += '</div>';

  phraseBank.forEach(function(g, gi){
    html += '<div class="pb-group" id="pb-'+gi+'">'+
              '<div class="pb-cat"><span class="jp">'+g.cat+'</span><span class="en">'+g.catEn+'</span></div>'+
              '<div class="phrasebank">';
    g.items.forEach(function(p){
      html += '<div class="phrase"><div class="pjp">'+p.jp+'</div><div class="pen">'+p.en+'</div></div>';
    });
    html += '</div></div>';
  });

  html += '<h2 class="modtitle"><span class="modnum">\u5834</span> Scenario Scripts</h2>'+
          '<div class="modtitle-en">Read both parts out loud, then cover the Japanese and try to reconstruct it from the English</div>';

  html += '<div class="modjump">';
  kaiwaScenarios.forEach(function(sc, i){
    html += '<button onclick="document.getElementById(\'sc-'+i+'\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">'+(i+1)+'. '+sc.jp+'</button>';
  });
  html += '</div>';

  kaiwaScenarios.forEach(function(sc, i){
    html += '<div class="scenario-card" id="sc-'+i+'">'+
      '<div class="scenario-head"><span class="sjp">'+(i+1)+'. '+sc.jp+'</span><span class="sen">'+sc.en+'</span></div>'+
      '<div class="scenario-body">'+
        '<div class="scenario-setup">'+sc.setup+'</div>'+
        '<div class="dialogue-box" style="margin-bottom:0;">';
    sc.lines.forEach(function(d){
      html += '<div class="dline"><div class="speaker" style="background:var(--indigo);">'+d.who+'</div>'+
              '<div class="dtext"><div class="jp">'+d.jp+'</div><div class="en">'+d.en+'</div></div></div>';
    });
    html += '</div>';

    if(sc.keyPhrases && sc.keyPhrases.length){
      html += '<div class="keyphrases"><div class="kplabel">TAKE THESE WITH YOU</div>';
      sc.keyPhrases.forEach(function(p){
        html += '<div class="kpline"><span class="kpjp">'+p.jp+'</span><span class="kpen">'+p.en+'</span></div>';
      });
      html += '</div>';
    }

    html += '<div class="roleplay-note"><b>Role-play it \u2014</b> '+sc.roleplay+'</div>'+
        renderQuizBlock('kaiwa'+i, sc.quiz, 'var(--indigo)') +
      '</div></div>';
  });

  document.getElementById('sec-kaiwa').innerHTML = html;
}

/* ============================================================
   RENDER: QUIZ CENTER
   ============================================================ */
function renderQuizCenter(){
  clearFinalQuizItems();
  var finalSample = getFinalQuizSample();
  var html = '<div class="section-head">'+
    '<div class="eyebrow-jp">総復習クイズ</div>'+
    '<h1>Quiz Center</h1>'+
    '<p>A mixed-format mock review \u2014 fill-in-the-blank grammar, kanji reading, and short comprehension \u2014 modeled on how the actual N4 groups these together. Each visit draws 10 questions at random from a pool of '+countQuizPool()+', so the set is different every time you come back. Your score below covers every quiz on this entire page, not just this section.</p>'+ 
  '</div>';

  html += '<div class="qc-score">'+
    '<div><div class="num" id="qc-score-num">0 / 0</div><div class="lbl">Correct / Answered \u2014 whole handbook</div></div>'+
    '<button class="qc-reset" id="qc-new-btn">New random set</button>'+ 
    '<button class="qc-reset" id="qc-reset-btn">Reset all quiz progress</button>'+ 
  '</div>';

  html += '<div class="qc-group-title">Random sample of 10</div>';
  html += '<div class="gcard" style="--accent:var(--gold);"><div class="quizbox"><div class="qlabel">MIXED REVIEW SET</div>';
  finalSample.forEach(function(entry, i){
    var qid = 'final-q'+i;
    finalQuizQids.push(qid);
    quizTotal++;
    QUIZ_BANK[qid] = entry.item;
    html += quizHTML(qid, entry.item, 'var(--gold)');
  });
  html += '</div></div>';

  html += '<footer class="pagefoot">Built for your December N4 attempt and the trip to Japan right after. Lesson/chapter references are approximate cross-references between editions \u2014 use them to find more practice in your own books, not as exact page numbers. Kanji classification follows commonly used N4 study references; the JLPT itself does not publish an official kanji list.</footer>';

  document.getElementById('sec-quiz').innerHTML = html;

  document.getElementById('qc-new-btn').addEventListener('click', function(){
    renderQuizCenter();
    updateProgress();
    updateQuizCenterScore();
  });

  document.getElementById('qc-reset-btn').addEventListener('click', function(){
    quizAnswered = {}; quizCorrect = {};
    document.querySelectorAll('.qchoice').forEach(function(b){
      b.classList.remove('correct','incorrect','disabled');
    });
    document.querySelectorAll('.qexplain').forEach(function(b){ b.classList.remove('show'); });
    updateProgress();
    updateQuizCenterScore();
  });
}

   NAV
   ============================================================ */
function showSection(name){
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('sec-'+name).classList.add('active');
  document.querySelectorAll('.navlink').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-section')===name);
  });
  document.querySelector('main.content').scrollTop = 0;
  window.scrollTo(0,0);
  closeSidebarMobile();
}
document.querySelectorAll('.navlink').forEach(function(btn){
  btn.addEventListener('click', function(){ showSection(btn.getAttribute('data-section')); });
});

function bindCollapsible(headId, bodyId){
  var head = document.getElementById(headId);
  var body = document.getElementById(bodyId);
  head.addEventListener('click', function(){
    head.classList.toggle('open');
    body.classList.toggle('open');
  });
}

/* mobile sidebar */
var sidebar = document.getElementById('sidebar');
var menubtn = document.getElementById('menubtn');
var scrim = document.getElementById('scrim');
menubtn.addEventListener('click', function(){
  sidebar.classList.add('open'); scrim.classList.add('show');
});
scrim.addEventListener('click', closeSidebarMobile);
function closeSidebarMobile(){
  sidebar.classList.remove('open'); scrim.classList.remove('show');
}

/* ============================================================
   SETTINGS
   ============================================================ */
var furiToggle = document.getElementById('toggle-furigana');
var darkToggle = document.getElementById('toggle-dark');
furiToggle.addEventListener('click', function(){
  furiToggle.classList.toggle('on');
  document.body.classList.toggle('no-furigana', !furiToggle.classList.contains('on'));
});
darkToggle.addEventListener('click', function(){
  darkToggle.classList.toggle('on');
  document.body.classList.toggle('dark', darkToggle.classList.contains('on'));
});
document.querySelectorAll('.fontsize-controls button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.fontsize-controls button').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    document.documentElement.style.setProperty('--fs-scale', btn.getAttribute('data-size'));
  });
});

/* ============================================================
   INIT
   ============================================================ */
renderOverview();
renderGrammar();
renderKanji();
renderReading();
renderKaiwa();
renderQuizCenter();
updateProgress();

})();
</script>
</body>
